<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Aquí vivía una segunda versión de la web, solo para móviles, con sus
         propios paneles, sus propios formularios y su propio vídeo de portada.
         Se retiró en septiembre de 2026 por decisión de Cipri: prefiere la web
         completa también en el teléfono, y mantener dos webs con el mismo
         contenido significaba arreglar cada cosa dos veces y que se
         contradijeran. El contenido de aquella versión sigue en el historial de
         git por si algún día hiciera falta.

         Este archivo se queda como reenvío para que los enlaces antiguos, los
         marcadores y lo que Google tenga indexado no acaben en un error 404. -->
    <title>ITACA JIU JITSU</title>
    <link rel="canonical" href="https://www.itacajiujitsu.com/">
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url=index.html">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.ico" sizes="any">
    <script>
        // El meta refresh de arriba ya funciona sin JavaScript; esto llega antes
        // y conserva el ancla (#horarios, #instructores…) del enlace original.
        location.replace('index.html' + location.hash);
    </script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font: 500 15px/1.6 system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
            background: #fff;
            color: #111;
            text-align: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        a {
            color: inherit;
        }
    </style>
</head>

<body>
    <p>Esta página se ha movido.<br>
        <a href="index.html">Ir a ITACA JIU JITSU</a>
    </p>
</body>

</html>
