<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Panel — Itaca Jiu Jitsu</title>
    <!-- Panel privado de uso interno, para ver de un vistazo quién ha escrito
         por la web y marcar qué toca hacer, sin abrir la hoja de cálculo.
         No sale enlazado desde ningún sitio de la web pública ni en
         buscadores (robots noindex + robots.txt). Los datos los sirve el
         mismo script de Google Apps Script que guarda los leads, protegido
         por una clave que solo conoce Cipri — ver docs/hoja-de-calculo.md.

         Rediseño del 18 de agosto de 2026: Cipri lo probó dos veces y pidió
         nivel "profesional", no una lista de tarjetas apiladas que en su
         portátil se quedaba en una columna estrecha en medio de la pantalla.
         Cambios de fondo (no solo estéticos):
         - Pestañas por ESTADO (Pendientes/Gestionadas/Estadísticas/Todas),
           no por fecha — antes mezclaba "cuándo llegó" con "qué falta por
           hacer" y confundía.
         - Cualquier acción se puede deshacer tocándola otra vez.
         - Estadísticas: este mes/año/desde siempre, por tipo, por acción,
           por marketing — calculado en el navegador, sin tocar Apps Script.
         - La cuadrícula de tarjetas y de números aprovecha el ancho en
           escritorio (se reparte en 2-3 columnas) en vez de quedarse en una
           columna de móvil estirada.

         19 de agosto: tres mejoras a petición de Cipri.
         - Notas por solicitud (columna "Notas" que ya existía en la hoja,
           antes sin usar) — se guardan solas al salir del cuadro de texto.
           Requiere el script de Apps Script actualizado (ver
           docs/hoja-de-calculo.md): añade el parámetro "campo" al guardar.
         - Aviso de solicitud "fría": una pendiente de más de 3 días sin
           gestionar se resalta y la pestaña Pendientes las ordena primero
           (las más urgentes arriba), en vez de solo por fecha de llegada.
         - Instalable como app (manifest.json + iconos) para abrirla desde
           el móvil sin pasar por el navegador. Sin service worker a
           propósito: ya hubo una confusión real por caché del navegador,
           y un service worker mal hecho la habría empeorado.

         19 de agosto (tarde): tras usarlo con datos reales, tres cosas más.
         - Archivar: para lo que ya no quiere seguir gestionando, sin
           borrarlo de la hoja (reversible, pestaña "Archivadas" aparte).
           El borrado permanente NO se implementó — es una decisión suya,
           no técnica, y no se pidió.
         - Tarjetas compactas: antes cada una mostraba mensaje, notas y
           4 botones siempre, y con varias solicitudes no cabían en
           pantalla. Ahora solo la cabecera (nombre/fecha/estado) se ve
           por defecto; se despliega al tocarla.
         - Filtros (buscador, mes, tipo) por encima de la lista, en todas
           las pestañas de solicitudes — para cuando ya hay volumen
           acumulado y hace falta encontrar una en concreto.

         20 de agosto (tarde): Cipri pidió avisos cuando llega un cliente
         nuevo. Sin servidor propio, la única forma honesta de hacerlo es
         con el propio navegador: cada 60s, mientras el panel siga abierto
         en alguna pestaña (aunque esté en segundo plano), se vuelve a
         pedir la lista y se compara con la anterior por número de fila.
         Si hay alguna nueva, notificación del sistema (Notification API,
         pide permiso una vez, con un botón) + un contador en el título de
         la pestaña. Límite real, dicho claramente a Cipri: si cierra el
         navegador del todo, esto no avisa — para eso ya tiene el correo
         de cada solicitud, que sí llega siempre. -->

    <link rel="manifest" href="/panel/manifest.json">
    <link rel="apple-touch-icon" href="/panel/icon-192.png">
    <meta name="theme-color" content="#0b0b0d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Panel Itaca">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        /* ══════════════════════════════════════════════════════════════
           PANEL ITACA — piel «sala de control»
           Rediseño visual del 20 de septiembre de 2026, a petición de
           Cipri: "algo futurista, que parezca que lo han hecho los de
           la NASA". Solo estética y reparto: ni una línea de la lógica
           cambió, y todos los nombres de clase siguen siendo los que
           escribe el JavaScript de abajo.

           Las tres decisiones que sostienen el look, por si alguien las
           toca sin querer:
           1. ESQUINA VIVA. border-radius: 0 en todo. Lo redondeado lee
              como aplicación de móvil; lo recto, como instrumento. Es la
              misma decisión que ya se tomó para la web en el móvil.
           2. TIPOGRAFÍA MONOESPACIADA para cifras, fechas y etiquetas,
              en mayúsculas y con las letras separadas. Es lo que más
              trabaja en el efecto "telemetría". Se usa la monoespaciada
              del sistema a propósito: no añade ninguna descarga.
           3. EL COLOR SOLO INFORMA. Verde = en marcha, ámbar = atención,
              rojo = se enfría, cian = dato. Nada de neón decorativo.
           ══════════════════════════════════════════════════════════════ */

        :root {
            --bg: #05070a;
            --panel: #0a0e13;
            --panel-2: #0f151c;
            --panel-3: #141c25;
            --linea: rgba(125, 165, 200, .16);
            --linea-fuerte: rgba(125, 165, 200, .32);
            --texto: #e2e9f0;
            --texto-dim: #8493a3;
            --texto-tenue: #5a6875;

            --verde: #2ee6a8;
            --verde-soft: rgba(46, 230, 168, .12);
            --ambar: #ffb03a;
            --ambar-soft: rgba(255, 176, 58, .12);
            --rojo: #ff5f5f;
            --rojo-soft: rgba(255, 95, 95, .12);
            --cian: #57d9ff;
            --cian-soft: rgba(87, 217, 255, .12);

            --mono: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            --lado: 300px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border-radius: 0;
        }

        body {
            font-family: 'Archivo', system-ui, sans-serif;
            background: var(--bg);
            color: var(--texto);
            line-height: 1.5;
            min-height: 100vh;
            /* Retícula tenue de fondo: da sensación de plano técnico sin
               competir con el contenido. */
            background-image:
                linear-gradient(var(--linea) 1px, transparent 1px),
                linear-gradient(90deg, var(--linea) 1px, transparent 1px);
            background-size: 64px 64px, 64px 64px;
            background-position: -1px -1px;
        }

        body::before {
            /* Viñeta: apaga la retícula en los bordes para que no maree. */
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 0%, transparent 0%, rgba(5, 7, 10, .55) 60%, var(--bg) 100%);
            z-index: 0;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit;
        }

        svg { display: block; }

        .icono {
            width: 1em;
            height: 1em;
            stroke: currentColor;
            stroke-width: 1.6;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex: 0 0 auto;
        }

        /* Marcas en las esquinas: las cuatro escuadras que hacen que un
           rectángulo parezca la ventana de un instrumento. */
        .escuadras { position: relative; }

        .escuadras::before,
        .escuadras::after {
            content: '';
            position: absolute;
            width: 9px;
            height: 9px;
            pointer-events: none;
            border-color: var(--linea-fuerte);
            border-style: solid;
        }

        /* Pegadas por dentro del borde, no a -1px: a ancho completo,
           un píxel que sobresale por la derecha basta para provocar
           scroll horizontal en toda la página. */
        .escuadras::before {
            top: 0; left: 0;
            border-width: 1px 0 0 1px;
        }

        .escuadras::after {
            bottom: 0; right: 0;
            border-width: 0 1px 1px 0;
        }

        /* ── Puerta de acceso ─────────────────────────────────────── */
        #puerta {
            position: relative;
            z-index: 1;
            max-width: 25rem;
            margin: 14vh auto;
            padding: 2.25rem;
            background: var(--panel);
            border: 1px solid var(--linea);
            box-shadow: 0 0 0 1px rgba(0, 0, 0, .5), 0 30px 80px rgba(0, 0, 0, .6);
        }

        #puerta::before {
            content: 'ACCESO RESTRINGIDO';
            display: block;
            font-family: var(--mono);
            font-size: .62rem;
            letter-spacing: .22em;
            color: var(--ambar);
            margin-bottom: 1.25rem;
            padding-bottom: .75rem;
            border-bottom: 1px solid var(--linea);
        }

        #puerta h1 {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -.01em;
            margin-bottom: .4rem;
        }

        #puerta p {
            color: var(--texto-dim);
            font-size: .85rem;
            margin-bottom: 1.4rem;
        }

        #puerta input {
            width: 100%;
            padding: .8rem .9rem;
            background: var(--bg);
            border: 1px solid var(--linea);
            font-family: var(--mono);
            letter-spacing: .18em;
            margin-bottom: .75rem;
            outline-offset: 2px;
        }

        #puerta input:focus-visible { border-color: var(--cian); outline: 1px solid var(--cian); }

        #puerta button {
            width: 100%;
            padding: .8rem;
            background: var(--verde);
            color: #00201a;
            border: 0;
            font-family: var(--mono);
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .18em;
            text-transform: uppercase;
            cursor: pointer;
        }

        #puerta button:hover { filter: brightness(1.12); }

        #puertaError {
            color: var(--rojo);
            font-family: var(--mono);
            font-size: .72rem;
            letter-spacing: .1em;
            margin-top: .8rem;
            display: none;
        }

        /* ── Armazón: consola a la izquierda, tablero a la derecha ── */
        /* #panel lo enciende y lo apaga el JavaScript con display en
           línea, así que la rejilla vive en .armazon: así no hay que
           tocar el script ni pelearse con !important. */
        #panel {
            display: none;
            position: relative;
            z-index: 1;
        }

        .armazon {
            display: grid;
            min-height: 100vh;
            grid-template-columns: minmax(0, 1fr);
        }

        @media (min-width: 1100px) {
            .armazon {
                grid-template-columns: var(--lado) minmax(0, 1fr);
                align-items: start;
            }
        }

        .consola,
        .tablero { min-width: 0; }

        .consola {
            border-right: 1px solid var(--linea);
            background: linear-gradient(180deg, var(--panel) 0%, rgba(10, 14, 19, .6) 100%);
            padding: 1.5rem 1.25rem 2rem;
        }

        @media (min-width: 1100px) {
            .consola {
                position: sticky;
                top: 0;
                height: 100vh;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
            }
        }

        .marca__nombre {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: .3em;
            line-height: 1;
        }

        .marca__sub {
            font-family: var(--mono);
            font-size: .58rem;
            letter-spacing: .2em;
            color: var(--texto-tenue);
            margin-top: .45rem;
        }

        .marca__linea {
            height: 1px;
            background: linear-gradient(90deg, var(--verde), transparent);
            margin-top: 1rem;
        }

        /* Lectura de estado: la hora de la última sincronización tratada
           como telemetría, con el punto verde latiendo. */
        .lectura {
            font-family: var(--mono);
            font-size: .64rem;
            letter-spacing: .14em;
            color: var(--texto-tenue);
            text-transform: uppercase;
        }

        .lectura__fila {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: .4rem 0;
            border-bottom: 1px dashed var(--linea);
        }

        .lectura__etq { flex: 1; }

        @media (min-width: 1100px) {
            .lectura__fila--sync {
                flex-direction: column;
                align-items: flex-start;
                gap: .15rem;
            }
        }

        #ultimaActualizacion {
            font-family: var(--mono);
            font-size: .64rem;
            letter-spacing: .1em;
            color: var(--cian);
            text-transform: uppercase;
        }

        .pulso {
            width: 6px;
            height: 6px;
            background: var(--verde);
            box-shadow: 0 0 0 0 var(--verde);
            animation: latido 2.4s ease-out infinite;
            flex: 0 0 auto;
        }

        @keyframes latido {
            0% { box-shadow: 0 0 0 0 rgba(46, 230, 168, .6); }
            70% { box-shadow: 0 0 0 7px rgba(46, 230, 168, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 230, 168, 0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .pulso { animation: none; }
        }

        .top-acciones {
            display: flex;
            gap: .5rem;
        }

        .btn-mini {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .45rem;
            padding: .6rem .5rem;
            background: transparent;
            border: 1px solid var(--linea);
            color: var(--texto-dim);
            font-family: var(--mono);
            font-size: .62rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            cursor: pointer;
            transition: border-color .15s, color .15s, background .15s;
        }

        .btn-mini:hover {
            border-color: var(--linea-fuerte);
            color: var(--texto);
            background: var(--panel-2);
        }

        .btn-mini.activo {
            border-color: var(--verde);
            color: var(--verde);
            background: var(--verde-soft);
        }

        /* Rótulo de sección, con el corchete delante. */
        .rotulo {
            font-family: var(--mono);
            font-size: .58rem;
            letter-spacing: .24em;
            color: var(--texto-tenue);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: .5rem;
            margin-bottom: .75rem;
        }

        .rotulo::before { content: '▸'; color: var(--verde); }
        .rotulo::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--linea);
        }

        /* ── Contadores ───────────────────────────────────────────── */
        .resumen {
            display: grid;
            gap: 1px;
            background: var(--linea);
            border: 1px solid var(--linea);
        }

        @media (min-width: 1100px) {
            .resumen { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 1099px) {
            .resumen { grid-template-columns: repeat(2, 1fr); }
        }

        .tile {
            background: var(--panel);
            padding: .85rem .9rem 1rem;
            display: flex;
            flex-direction: column;
            gap: .1rem;
            position: relative;
            overflow: hidden;
        }

        .tile__cabecera { display: none; }

        .tile__num {
            font-family: var(--mono);
            font-size: 1.85rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -.02em;
            font-variant-numeric: tabular-nums;
        }

        .tile__label {
            font-family: var(--mono);
            font-size: .55rem;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--texto-tenue);
            margin-top: .35rem;
        }

        /* La barrita de color a la izquierda dice de qué va cada cifra.
           El icono original se oculta: el color ya lo cuenta. */
        .tile::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: var(--texto-tenue);
        }

        .tile:has(.ambar)::before { background: var(--ambar); }
        .tile:has(.verde)::before { background: var(--verde); }
        .tile:has(.ambar) .tile__num { color: var(--ambar); }
        .tile:has(.verde) .tile__num { color: var(--verde); }

        /* ── Pestañas: navegación vertical en la consola ──────────── */
        .pestanas {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--linea);
        }

        .pestana {
            display: flex;
            align-items: center;
            gap: .6rem;
            width: 100%;
            padding: .65rem .8rem;
            background: transparent;
            border: 0;
            border-bottom: 1px solid var(--linea);
            color: var(--texto-dim);
            font-family: var(--mono);
            font-size: .66rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            text-align: left;
            cursor: pointer;
            position: relative;
            transition: color .15s, background .15s;
        }

        .pestana:last-child { border-bottom: 0; }

        .pestana::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: transparent;
            transition: background .15s;
        }

        .pestana:hover { color: var(--texto); background: var(--panel-2); }

        .pestana.activa {
            color: var(--verde);
            background: var(--verde-soft);
        }

        .pestana.activa::before { background: var(--verde); }

        .cuenta {
            margin-left: auto;
            font-variant-numeric: tabular-nums;
            color: var(--texto-tenue);
        }

        .pestana.activa .cuenta { color: var(--verde); }

        /* ── Tablero (columna derecha) ────────────────────────────── */
        .tablero {
            padding: 1.5rem 1.5rem 5rem;
            min-width: 0;
        }

        @media (min-width: 1100px) {
            .tablero { padding: 2rem 2.25rem 5rem; }
        }

        .tablero__titulo {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--linea);
        }

        .tablero__titulo h1 {
            font-size: clamp(1.5rem, 3.4vw, 2.1rem);
            font-weight: 900;
            letter-spacing: -.02em;
            line-height: 1;
        }

        .sello {
            font-family: var(--mono);
            font-size: .58rem;
            letter-spacing: .2em;
            color: var(--texto-tenue);
            text-transform: uppercase;
        }

        /* ── Filtros ──────────────────────────────────────────────── */
        /* Flex y no grid a propósito: el JavaScript pone
           filtros.style.display = 'flex' al cambiar de pestaña, y un
           estilo en línea gana siempre. Peleárselo con !important sería
           pedir un fallo silencioso el día que alguien toque el JS. */
        .filtros {
            display: flex;
            flex-wrap: wrap;
            gap: 1px;
            background: var(--linea);
            border: 1px solid var(--linea);
            margin-bottom: 1.5rem;
        }

        .filtros input { flex: 3 1 220px; }
        .filtros select { flex: 1 1 150px; }

        .filtros input,
        .filtros select {
            min-width: 0;
            padding: .7rem .85rem;
            background: var(--panel);
            border: 0;
            font-family: var(--mono);
            font-size: .7rem;
            letter-spacing: .08em;
            outline-offset: -2px;
        }

        .filtros input::placeholder {
            color: var(--texto-tenue);
            letter-spacing: .12em;
            text-transform: uppercase;
            font-size: .66rem;
        }

        .filtros select {
            text-transform: uppercase;
            color: var(--texto-dim);
            appearance: none;
            background-image: linear-gradient(45deg, transparent 50%, var(--texto-tenue) 50%), linear-gradient(135deg, var(--texto-tenue) 50%, transparent 50%);
            background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
        }

        .filtros input:focus-visible,
        .filtros select:focus-visible { outline: 1px solid var(--cian); }

        /* ── Rejilla de solicitudes ───────────────────────────────── */
        #lista {
            display: grid;
            gap: 1rem;
            grid-template-columns: 1fr;
            align-items: start;
        }

        @media (min-width: 1100px) {
            #lista { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
        }

        /* Una tarjeta abierta ocupa toda la fila: el detalle necesita
           ancho y así no descoloca a las vecinas. */
        @media (min-width: 1100px) {
            .card.abierta { grid-column: 1 / -1; }
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--linea);
            position: relative;
            transition: border-color .15s, background .15s;
        }

        .card::before {
            /* Franja de estado: lo primero que lee el ojo. */
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--ambar);
        }

        .card.resuelto::before { background: var(--verde); }
        .card.frio::before { background: var(--rojo); }

        .card:hover { border-color: var(--linea-fuerte); background: var(--panel-2); }

        .card.abierta { border-color: var(--linea-fuerte); background: var(--panel-2); }

        .card__cabecera {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            grid-template-areas:
                "avatar id chevron"
                "estado estado estado";
            align-items: center;
            gap: .75rem .8rem;
            padding: .9rem 1rem .75rem 1.15rem;
            cursor: pointer;
        }

        .avatar {
            grid-area: avatar;
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            background: var(--panel-3);
            border: 1px solid var(--linea);
            font-family: var(--mono);
            font-size: .62rem;
            font-weight: 700;
            letter-spacing: .06em;
            color: var(--cian);
        }

        .card.frio .avatar { color: var(--rojo); border-color: rgba(255, 95, 95, .3); }
        .card.resuelto .avatar { color: var(--verde); }

        .card__id { grid-area: id; min-width: 0; }

        /* El nombre dispone de todo el ancho: antes la etiqueta de estado
           se lo comía y "Tomás Íñigo" salía partido en dos líneas. */
        .card__nombre {
            font-size: 1.02rem;
            font-weight: 800;
            letter-spacing: -.01em;
            line-height: 1.15;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card__fecha {
            font-family: var(--mono);
            font-size: .62rem;
            letter-spacing: .12em;
            color: var(--texto-tenue);
            margin-top: .2rem;
        }

        .card__chevron {
            grid-area: chevron;
            width: 14px;
            height: 14px;
            color: var(--texto-tenue);
            transition: transform .2s;
        }

        .card.abierta .card__chevron { transform: rotate(180deg); }

        .aviso-frio {
            display: flex;
            align-items: center;
            gap: .35rem;
            margin-top: .4rem;
            font-family: var(--mono);
            font-size: .6rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--rojo);
        }

        .aviso-frio .icono { width: .85em; height: .85em; }

        .badge-estado {
            grid-area: estado;
            display: flex;
            align-items: center;
            gap: .4rem;
            padding: .4rem .6rem;
            background: var(--ambar-soft);
            border-left: 2px solid var(--ambar);
            color: var(--ambar);
            font-family: var(--mono);
            font-size: .58rem;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        .badge-estado.hecho {
            background: var(--verde-soft);
            border-left-color: var(--verde);
            color: var(--verde);
        }

        .badge-estado .icono { width: .9em; height: .9em; }

        /* ── Detalle desplegable ──────────────────────────────────── */
        .card__detalle {
            display: none;
            padding: 0 1rem 1rem 1.15rem;
            border-top: 1px solid var(--linea);
            margin-top: .15rem;
            padding-top: 1rem;
        }

        .card.abierta .card__detalle { display: block; }

        .card__meta {
            display: flex;
            flex-wrap: wrap;
            gap: .4rem;
            margin-bottom: .85rem;
        }

        .etiqueta {
            padding: .25rem .5rem;
            background: var(--panel-3);
            border: 1px solid var(--linea);
            font-family: var(--mono);
            font-size: .55rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--texto-dim);
        }

        .etiqueta.tipo-prueba { color: var(--cian); border-color: rgba(87, 217, 255, .3); }
        .etiqueta.ofertas { color: var(--verde); border-color: rgba(46, 230, 168, .3); }

        .card__mensaje {
            font-size: .88rem;
            color: var(--texto-dim);
            line-height: 1.6;
            padding: .75rem .9rem;
            background: var(--bg);
            border-left: 2px solid var(--linea-fuerte);
            margin-bottom: .85rem;
        }

        .card__mensaje em { color: var(--texto-tenue); }

        .card__nota {
            width: 100%;
            min-height: 62px;
            resize: vertical;
            padding: .7rem .85rem;
            background: var(--bg);
            border: 1px dashed var(--linea-fuerte);
            font-family: var(--mono);
            font-size: .74rem;
            line-height: 1.5;
            margin-bottom: .85rem;
            outline-offset: -2px;
        }

        .card__nota::placeholder {
            color: var(--texto-tenue);
            font-size: .66rem;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .card__nota:focus-visible { outline: 1px solid var(--cian); border-color: var(--cian); }

        .card__acciones {
            display: flex;
            flex-wrap: wrap;
            gap: .45rem;
        }

        /* Abierta a todo lo ancho, el detalle se reparte en dos columnas:
           una línea de texto de 1.400 px no hay quien la lea, y el hueco
           de la derecha quedaba vacío. El orden del HTML no cambia — se
           recolocan con áreas de rejilla. */
        @media (min-width: 1100px) {
            .card.abierta .card__detalle {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                grid-template-areas:
                    "meta     nota"
                    "mensaje  nota"
                    "acciones acciones";
                align-content: start;
                column-gap: 1.5rem;
            }

            .card.abierta .card__meta { grid-area: meta; }
            .card.abierta .card__mensaje { grid-area: mensaje; align-self: start; }
            .card.abierta .card__nota { grid-area: nota; min-height: 100%; margin-bottom: 0; }
            .card.abierta .card__acciones { grid-area: acciones; padding-top: .85rem; }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .5rem .75rem;
            background: transparent;
            border: 1px solid var(--linea);
            color: var(--texto-dim);
            font-family: var(--mono);
            font-size: .6rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition: border-color .15s, color .15s, background .15s;
        }

        .btn:hover { border-color: var(--linea-fuerte); color: var(--texto); background: var(--panel-3); }

        .btn.whatsapp {
            border-color: rgba(46, 230, 168, .4);
            color: var(--verde);
        }

        .btn.whatsapp:hover { background: var(--verde-soft); border-color: var(--verde); }

        .btn.elegido {
            background: var(--cian-soft);
            border-color: var(--cian);
            color: var(--cian);
        }

        .btn .icono { width: .95em; height: .95em; }

        /* ── Estados vacíos y avisos ──────────────────────────────── */
        #estado,
        #vacio {
            padding: 2.5rem 1.25rem;
            text-align: center;
            font-family: var(--mono);
            color: var(--texto-tenue);
            border: 1px dashed var(--linea);
        }

        #vacio {
            font-size: .72rem;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        /* #estado lleva los mensajes de error, que son frases largas y
           explican qué hay que arreglar. En mayúsculas no se leen: se
           dejan tal cual, con ancho de lectura cómodo. */
        #estado {
            font-size: .82rem;
            line-height: 1.7;
            letter-spacing: .01em;
            max-width: 46rem;
            margin: 0 auto;
            color: var(--texto-dim);
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 1.5rem;
            transform: translate(-50%, 200%);
            z-index: 50;
            padding: .7rem 1.1rem;
            background: var(--panel-3);
            border: 1px solid var(--linea-fuerte);
            border-left: 3px solid var(--verde);
            font-family: var(--mono);
            font-size: .66rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .7);
            transition: transform .25s ease;
        }

        #toast.visible { transform: translate(-50%, 0); }

        /* ── Estadísticas ─────────────────────────────────────────── */
        .stats-grid {
            display: grid;
            gap: 1px;
            background: var(--linea);
            border: 1px solid var(--linea);
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            margin-bottom: 1.75rem;
            /* Solo son tres cifras: a todo lo ancho quedaban tres cajas
               casi vacías. Se limitan para que parezca intencionado. */
            max-width: 46rem;
        }

        .stats-grid .tile { padding: 1.1rem 1.1rem 1.25rem; }
        .stats-grid .tile__num { font-size: 2.3rem; color: var(--cian); }
        .stats-grid .tile::before { background: var(--cian); }

        .stats-cols {
            display: grid;
            gap: 1.75rem;
            grid-template-columns: 1fr;
        }

        @media (min-width: 900px) {
            .stats-cols { grid-template-columns: 1fr 1fr; gap: 2.5rem; }
        }

        .stats-seccion { margin-bottom: 1.75rem; }

        .stats-seccion h2 {
            font-family: var(--mono);
            font-size: .58rem;
            font-weight: 500;
            letter-spacing: .24em;
            text-transform: uppercase;
            color: var(--texto-tenue);
            display: flex;
            align-items: center;
            gap: .5rem;
            margin-bottom: 1rem;
        }

        .stats-seccion h2::before { content: '▸'; color: var(--cian); }
        .stats-seccion h2::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--linea);
        }

        .stats-fila { margin-bottom: 1rem; }

        .stats-fila__linea {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            font-size: .82rem;
            margin-bottom: .4rem;
        }

        .stats-fila__num {
            font-family: var(--mono);
            font-size: .68rem;
            letter-spacing: .1em;
            color: var(--cian);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        /* Medidor segmentado en vez de barra lisa: se lee como un
           indicador de instrumento y además deja contar los tramos. */
        .stats-barra {
            height: 10px;
            background: repeating-linear-gradient(90deg,
                    var(--panel-3) 0 6px,
                    transparent 6px 9px);
            border: 1px solid var(--linea);
            position: relative;
        }

        .stats-barra__relleno {
            height: 100%;
            background: repeating-linear-gradient(90deg,
                    var(--cian) 0 6px,
                    transparent 6px 9px);
            transition: width .4s ease;
        }

        /* ── Móvil: una sola columna, misma piel ──────────────────── */
        @media (max-width: 1099px) {
            body { background-size: 44px 44px, 44px 44px; }

            .consola {
                border-right: 0;
                border-bottom: 1px solid var(--linea);
                padding: 1.1rem 1rem 1.25rem;
                display: grid;
                gap: 1rem;
                /* minmax(0,1fr) y no 'auto': sin esto la columna se ajusta
                   al hijo más ancho (la fila de pestañas, que no parte
                   línea) y aparece scroll horizontal en toda la página. */
                grid-template-columns: minmax(0, 1fr);
            }

            .consola__cabecera {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
            }

            .marca__linea { display: none; }

            .pestanas {
                flex-direction: row;
                overflow-x: auto;
                scrollbar-width: none;
            }

            .pestanas::-webkit-scrollbar { display: none; }

            .pestana {
                border-bottom: 0;
                border-right: 1px solid var(--linea);
                white-space: nowrap;
                padding: .6rem .85rem;
            }

            .pestana:last-child { border-right: 0; }

            .pestana::before { top: auto; bottom: 0; right: 0; width: auto; height: 2px; }

            .tablero { padding: 1.25rem 1rem 4rem; }

            .card__nombre { font-size: .98rem; }
        }

        /* En el teléfono la consola tiene que ocupar lo mínimo: antes de
           este bloque había que bajar casi una pantalla entera de
           cabecera para llegar a la primera solicitud, y el panel se usa
           sobre todo desde el móvil. Los contadores pasan a una tira de
           cuatro y todo se aprieta. */
        @media (max-width: 1099px) {
            .consola { padding: .9rem 1rem 1rem; gap: .85rem; }

            .marca__nombre { font-size: .95rem; letter-spacing: .26em; }
            .marca__sub { font-size: .52rem; margin-top: .25rem; }

            .lectura__fila { padding: .3rem 0; }

            .rotulo { margin-bottom: .5rem; font-size: .54rem; }

            .resumen { grid-template-columns: repeat(4, 1fr); }
            .tile { padding: .6rem .5rem .65rem; align-items: center; text-align: center; }
            .tile::before { width: 100%; height: 2px; bottom: auto; }
            .tile__num { font-size: 1.35rem; }
            .tile__label { font-size: .46rem; letter-spacing: .1em; margin-top: .25rem; }

            .btn-mini { padding: .5rem .4rem; font-size: .58rem; }

            .tablero__titulo { margin-bottom: 1rem; padding-bottom: .75rem; }
        }

        @media (max-width: 360px) {
            .tile__num { font-size: 1.15rem; }
            .tile__label { font-size: .42rem; }
        }
    </style>
</head>

<body>

    <div id="puerta">
        <h1>Panel de solicitudes</h1>

    <div id="panel">

      <div class="armazon">

                    <svg class="icono" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span id="avisosBtnTexto">Avisos</span>

                <button class="btn-mini" id="actualizarBtn">
                    <svg class="icono" viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/></svg>
                    Actualizar
                </button>

            <div class="bloque-consola">

        <main class="tablero">

        </main>

      </div>
    </div>

    <div id="toast"></div>

    <script>
        (function () {
            'use strict';

            // Mismo script de Apps Script que guarda los formularios de la web.
            var URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbznoclHahK9i4BwcAn8vgy8IgoZ1M41a2oORVuyE29fJHQdBj2B1E5HBbH5WezNgNoF/exec';
            var CLAVE_GUARDADA = 'itaca_panel_clave';

            var PESTANAS = [
                { id: 'pendientes', etiqueta: 'Pendientes' },
                { id: 'gestionadas', etiqueta: 'Gestionadas' },
                { id: 'archivadas', etiqueta: 'Archivadas' },
                { id: 'estadisticas', etiqueta: 'Estadísticas' },
                { id: 'todas', etiqueta: 'Todas' }
            ];

            var OPCIONES_ESTADO = ['Mandar info', 'Apuntar a la prueba', 'Otro'];
            var DIAS_PARA_ENFRIARSE = 3;
            var NOMBRES_MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
                'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

            // Iconos, trazo único, sin dependencias externas.
            var ICONOS = {
                lista: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r=".9" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r=".9" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r=".9" fill="currentColor" stroke="none"/>',
                reloj: '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>',
                check: '<path d="M21 11.5V12a9 9 0 1 1-5.5-8.3"/><polyline points="21 4.5 12 14 9 11"/>',
                chispa: '<path d="M12 2.5l1.7 6.3 6.3 1.7-6.3 1.7L12 18.5l-1.7-6.3-6.3-1.7 6.3-1.7z"/>',
                chat: '<path d="M4 4.5h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-4.5 3.5V17.5H4a1 1 0 0 1-1-1v-11a1 1 0 0 1 1-1z" fill="currentColor" stroke="none"/>',
                chevron: '<polyline points="6 9 12 15 18 9"/>',
                archivo: '<path d="M3 7h18v13H3z"/><path d="M3 7l2-4h14l2 4"/><line x1="10" y1="12" x2="14" y2="12"/>'
            };

            function icono(nombre, extraClase) {
                return '<svg class="icono' + (extraClase ? ' ' + extraClase : '') + '" viewBox="0 0 24 24">' + ICONOS[nombre] + '</svg>';
            }

            var puerta = document.getElementById('puerta');
            var panel = document.getElementById('panel');
            var claveInput = document.getElementById('claveInput');
            var entrarBtn = document.getElementById('entrarBtn');
            var puertaError = document.getElementById('puertaError');
            var estadoEl = document.getElementById('estado');
            var listaEl = document.getElementById('lista');
            var estadisticasEl = document.getElementById('estadisticas');
            var vacioEl = document.getElementById('vacio');
            var actualizarBtn = document.getElementById('actualizarBtn');
            var avisosBtn = document.getElementById('avisosBtn');
            var pestanasEl = document.getElementById('pestanas');
            var resumenEl = document.getElementById('resumen');
            var toastEl = document.getElementById('toast');
            var ultimaActualizacionEl = document.getElementById('ultimaActualizacion');
            var filtrosEl = document.getElementById('filtros');
            var buscadorEl = document.getElementById('buscador');
            var filtroMesEl = document.getElementById('filtroMes');
            var filtroTipoEl = document.getElementById('filtroTipo');

            var pestanaActiva = 'pendientes';
            var ultimosLeads = [];
            var toastTimer = null;
            var ultimaCarga = null;
            var expandidas = {};
            var filtroTexto = '';
            var filtroMes = '';
            var filtroTipo = '';
            var TITULO_BASE = 'Panel — Itaca Jiu Jitsu';
            var idsConocidos = null; // null = todavía no se ha cargado nada
            var nuevasSinVer = 0;

            /* La fecha llega como "dd/MM HH:mm" (sin año). Se asume el año
               actual; si el resultado queda en el futuro, es que la
               solicitud es del año anterior. */
            function parsearFecha(fechaStr) {
                var m = /^(\d{2})\/(\d{2}) (\d{2}):(\d{2})$/.exec(fechaStr || '');
                if (!m) return null;
                var ahora = new Date();
                var d = new Date(ahora.getFullYear(), Number(m[2]) - 1, Number(m[1]), Number(m[3]), Number(m[4]));
                if (d.getTime() > ahora.getTime() + 24 * 60 * 60 * 1000) {
                    d.setFullYear(d.getFullYear() - 1);
                }
                return d;
            }

            function esDeHoy(lead) {
                var d = parsearFecha(lead.fecha);
                if (!d) return false;
                var hoy = new Date();
                return d.getFullYear() === hoy.getFullYear() && d.getMonth() === hoy.getMonth() && d.getDate() === hoy.getDate();
            }

            function esDeEsteMes(lead) {
                var d = parsearFecha(lead.fecha);
                if (!d) return false;
                var hoy = new Date();
                return d.getFullYear() === hoy.getFullYear() && d.getMonth() === hoy.getMonth();
            }

            function esDeEsteAnio(lead) {
                var d = parsearFecha(lead.fecha);
                if (!d) return false;
                var hoy = new Date();
                return d.getFullYear() === hoy.getFullYear();
            }

            function diasSinGestionar(lead) {
                var d = parsearFecha(lead.fecha);
                if (!d) return 0;
                return Math.floor((Date.now() - d.getTime()) / 86400000);
            }

            function tipoDe(lead) {
                return String(lead.tipo || '').indexOf('prueba') !== -1 ? 'prueba' : 'contacto';
            }

            function claveMes(d) {
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
            }

            function coincideFiltro(lead) {
                if (filtroTipo && filtroTipo !== tipoDe(lead)) return false;
                if (filtroMes) {
                    var d = parsearFecha(lead.fecha);
                    if (!d || claveMes(d) !== filtroMes) return false;
                }
                if (filtroTexto) {
                    var q = filtroTexto.toLowerCase();
                    var enNombre = String(lead.nombre || '').toLowerCase().indexOf(q) !== -1;
                    var enTelefono = String(lead.telefono || '').indexOf(q) !== -1;
                    if (!enNombre && !enTelefono) return false;
                }
                return true;
            }

            function enlaceWhatsApp(telefono, nombre) {
                /* La hoja de Google puede guardar el teléfono como número, no
                   como texto, según cómo lo haya escrito quien rellenó el
                   formulario — por eso se fuerza a texto antes de nada. */
                var num = String(telefono || '').replace(/[^\d]/g, '');
                if (!num) return null;
                if (num.length === 9) num = '34' + num;
                else if (num.indexOf('0034') === 0) num = num.slice(2);
                if (num.length < 11) return null;
                var primerNombre = String(nombre || '').split(' ')[0];
                var texto = 'Hola' + (primerNombre ? ' ' + primerNombre : '') +
                    ', soy de Itaca Jiu Jitsu. Te escribo por tu solicitud desde la web.';
                return 'https://wa.me/' + num + '?text=' + encodeURIComponent(texto);
            }

            function iniciales(nombre) {
                var partes = String(nombre || '').trim().split(/\s+/).filter(Boolean);
                if (!partes.length) return '?';
                if (partes.length === 1) return partes[0].slice(0, 2).toUpperCase();
                return (partes[0][0] + partes[1][0]).toUpperCase();
            }

            function escapar(s) {
                var div = document.createElement('div');
                div.textContent = s || '';
                return div.innerHTML;
            }

            function mostrarToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('visible');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(function () {
                    toastEl.classList.remove('visible');
                }, 2200);
            }

            function tile(iconoNombre, claseIcono, num, label) {
                return '<div class="tile">' +
                    '<div class="tile__cabecera"><span class="tile__icono ' + claseIcono + '">' + icono(iconoNombre) + '</span></div>' +
                    '<div class="tile__num">' + num + '</div>' +
                    '<div class="tile__label">' + escapar(label) + '</div>' +
                    '</div>';
            }

            function pintarResumen(leads) {
                var pendientes = leads.filter(function (l) { return !l.accion && !l.archivada; }).length;
                var gestionadas = leads.filter(function (l) { return l.accion && !l.archivada; }).length;
                var hoy = leads.filter(esDeHoy).length;
                resumenEl.innerHTML =
                    tile('lista', '', leads.length, 'Total') +
                    tile('reloj', 'ambar', pendientes, 'Pendientes') +
                    tile('check', 'verde', gestionadas, 'Gestionadas') +
                    tile('chispa', 'verde', hoy, 'Nuevas hoy');
            }

            function pintarPestanas(leads) {
                pestanasEl.innerHTML = '';
                var cuentas = {
                    pendientes: leads.filter(function (l) { return !l.accion && !l.archivada; }).length,
                    gestionadas: leads.filter(function (l) { return l.accion && !l.archivada; }).length,
                    archivadas: leads.filter(function (l) { return l.archivada; }).length,
                    todas: leads.length
                };
                PESTANAS.forEach(function (p) {
                    var btn = document.createElement('button');
                    btn.className = 'pestana' + (p.id === pestanaActiva ? ' activa' : '');
                    btn.dataset.pestana = p.id;
                    var cuentaHtml = p.id in cuentas ? '<span class="cuenta">' + cuentas[p.id] + '</span>' : '';
                    btn.innerHTML = escapar(p.etiqueta) + cuentaHtml;
                    pestanasEl.appendChild(btn);
                });
            }

            function statFila(label, num, total) {
                var pct = total ? Math.round((num / total) * 100) : 0;
                return '<div class="stats-fila">' +
                    '<div class="stats-fila__linea"><span>' + escapar(label) + '</span>' +
                    '<span class="stats-fila__num">' + num + ' · ' + pct + '%</span></div>' +
                    '<div class="stats-barra"><div class="stats-barra__relleno" style="width:' + pct + '%"></div></div>' +
                    '</div>';
            }

            function pintarEstadisticas(leads) {
                var total = leads.length;
                if (!total) {
                    estadisticasEl.innerHTML = '';
                    return;
                }
                var esteMes = leads.filter(esDeEsteMes).length;
                var esteAnio = leads.filter(esDeEsteAnio).length;

                var pruebas = leads.filter(function (l) { return String(l.tipo || '').indexOf('prueba') !== -1; }).length;
                var contactos = total - pruebas;

                var sinGestionar = leads.filter(function (l) { return !l.accion && !l.archivada; }).length;
                var ofertas = leads.filter(function (l) { return l.aceptaOfertas === 'Sí'; }).length;

                var html = '<div class="stats-grid">' +
                    tile('lista', '', esteMes, 'Este mes') +
                    tile('lista', '', esteAnio, 'Este año') +
                    tile('lista', '', total, 'Desde siempre') +
                    '</div>';

                html += '<div class="stats-cols">';

                html += '<div>' +
                    '<div class="stats-seccion"><h2>Por tipo de solicitud</h2>' +
                    statFila('Contacto', contactos, total) +
                    statFila('Clase de prueba', pruebas, total) +
                    '</div>' +
                    '<div class="stats-seccion"><h2>Marketing</h2>' +
                    statFila('Quieren recibir ofertas', ofertas, total) +
                    '</div>' +
                    '</div>';

                html += '<div>' +
                    '<div class="stats-seccion"><h2>Por acción</h2>' +
                    statFila('Sin gestionar', sinGestionar, total) +
                    OPCIONES_ESTADO.map(function (op) {
                        return statFila(op, leads.filter(function (l) { return l.accion === op; }).length, total);
                    }).join('') +
                    '</div>' +
                    '</div>';

                html += '</div>';

                estadisticasEl.innerHTML = html;
            }

            function pintarFiltroMes(leads) {
                var meses = {};
                leads.forEach(function (l) {
                    var d = parsearFecha(l.fecha);
                    if (d) meses[claveMes(d)] = d;
                });
                var claves = Object.keys(meses).sort().reverse();
                var valorActual = filtroMesEl.value;
                filtroMesEl.innerHTML = '<option value="">Todos los meses</option>' + claves.map(function (clave) {
                    var d = meses[clave];
                    return '<option value="' + clave + '">' + NOMBRES_MES[d.getMonth()] + ' ' + d.getFullYear() + '</option>';
                }).join('');
                if (claves.indexOf(valorActual) !== -1) filtroMesEl.value = valorActual;
            }

            function pintarLeads(leads) {
                ultimosLeads = leads;
                pintarResumen(leads);
                pintarPestanas(leads);

                if (pestanaActiva === 'estadisticas') {
                    filtrosEl.style.display = 'none';
                    listaEl.style.display = 'none';
                    vacioEl.style.display = 'none';
                    estadisticasEl.style.display = 'block';
                    pintarEstadisticas(leads);
                    return;
                }
                estadisticasEl.style.display = 'none';
                filtrosEl.style.display = 'flex';
                listaEl.style.display = 'grid';
                pintarFiltroMes(leads);

                listaEl.innerHTML = '';
                var visibles = leads.filter(function (l) {
                    if (pestanaActiva === 'pendientes') { if (l.accion || l.archivada) return false; }
                    else if (pestanaActiva === 'gestionadas') { if (!l.accion || l.archivada) return false; }
                    else if (pestanaActiva === 'archivadas') { if (!l.archivada) return false; }
                    return coincideFiltro(l);
                });

                /* En Pendientes, la más urgente (la que lleva más tiempo sin
                   respuesta) va primero — si no, con el orden habitual
                   (más reciente arriba) una solicitud antigua se hunde al
                   final y es fácil que se quede sin contestar sin querer. */
                if (pestanaActiva === 'pendientes') {
                    visibles = visibles.slice().sort(function (a, b) {
                        return diasSinGestionar(b) - diasSinGestionar(a);
                    });
                }

                if (!visibles.length) {
                    vacioEl.style.display = 'block';
                    return;
                }
                vacioEl.style.display = 'none';

                visibles.forEach(function (lead) {
                  try {
                    var dias = diasSinGestionar(lead);
                    var esFrio = !lead.accion && !lead.archivada && dias >= DIAS_PARA_ENFRIARSE;

                    var card = document.createElement('div');
                    card.className = 'card' + (lead.accion ? ' resuelto' : '') + (esFrio ? ' frio' : '') +
                        (expandidas[lead.fila] ? ' abierta' : '');

                    var tipoTexto = String(lead.tipo || '');
                    var etiquetas = '';
                    if (tipoTexto.indexOf('prueba') !== -1) {
                        etiquetas += '<span class="etiqueta tipo-prueba">Clase de prueba</span>';
                    } else {
                        etiquetas += '<span class="etiqueta">Contacto</span>';
                    }
                    if (lead.categoria) etiquetas += '<span class="etiqueta">' + escapar(lead.categoria) + '</span>';
                    if (lead.dia) etiquetas += '<span class="etiqueta">' + escapar(lead.dia) + '</span>';
                    if (lead.aceptaOfertas === 'Sí') etiquetas += '<span class="etiqueta ofertas">Quiere ofertas</span>';

                    var wa = enlaceWhatsApp(lead.telefono, lead.nombre);

                    var badgeEstado = '<span class="badge-estado' + (lead.accion ? ' hecho' : '') + '">' +
                        icono(lead.accion ? 'check' : 'reloj') +
                        (lead.accion ? escapar(lead.accion) : 'Sin gestionar') + '</span>';

                    var botonesEstado = OPCIONES_ESTADO.map(function (op) {
                        var elegido = lead.accion === op ? ' elegido' : '';
                        return '<button class="btn estado-btn' + elegido + '" data-fila="' + lead.fila +
                            '" data-valor="' + escapar(op) + '">' + op + '</button>';
                    }).join('');

                    var botonArchivar = '<button class="btn archivar-btn' + (lead.archivada ? ' elegido' : '') +
                        '" data-fila="' + lead.fila + '">' + icono('archivo') +
                        (lead.archivada ? 'Desarchivar' : 'Archivar') + '</button>';

                    card.innerHTML =
                        '<div class="card__cabecera" data-fila="' + lead.fila + '">' +
                        '<div class="avatar">' + escapar(iniciales(lead.nombre)) + '</div>' +
                        '<div class="card__id">' +
                        '<div class="card__nombre">' + (escapar(lead.nombre) || '(sin nombre)') + '</div>' +
                        '<div class="card__fecha">' + escapar(lead.fecha) + '</div>' +
                        (esFrio ? '<div class="aviso-frio">' + icono('reloj') + dias + ' días sin responder</div>' : '') +
                        '</div>' +
                        badgeEstado +
                        icono('chevron', 'card__chevron') +
                        '</div>' +
                        '<div class="card__detalle">' +
                        '<div class="card__meta">' + etiquetas + '</div>' +
                        '<div class="card__mensaje">' + (escapar(lead.mensaje) || '<em>Sin mensaje</em>') + '</div>' +
                        '<textarea class="card__nota" data-fila="' + lead.fila + '" placeholder="Notas para ti (privadas)…">' + escapar(lead.nota) + '</textarea>' +
                        '<div class="card__acciones">' +
                        (wa ? '<a class="btn whatsapp" href="' + wa + '" target="_blank" rel="noopener">' + icono('chat') + 'WhatsApp</a>' : '') +
                        botonesEstado + botonArchivar +
                        '</div>' +
                        '</div>';

                    listaEl.appendChild(card);
                  } catch (err) {
                    /* Una fila con datos inesperados no debe tirar abajo el
                       resto del panel — se salta esa tarjeta y sigue con las
                       demás, en vez de dejar la pantalla en blanco sin aviso. */
                    console.error('No se pudo pintar un lead:', lead, err);
                  }
                });
            }

            /* Tocar la misma opción que ya está marcada la deshace (vuelve a
               "sin gestionar") — antes era un camino de un solo sentido y
               Cipri se quedaba sin saber cómo volver atrás. */
            function cambiarEstado(fila, valorTocado) {
                var lead = ultimosLeads.filter(function (l) { return l.fila === fila; })[0];
                if (!lead) return;
                var nuevoValor = lead.accion === valorTocado ? '' : valorTocado;
                lead.accion = nuevoValor;

                pintarLeads(ultimosLeads);
                mostrarToast(nuevoValor ? ('Marcado: ' + nuevoValor) : 'Vuelto a pendiente');

                pedirAlScript({ accion: 'actualizar', fila: fila, valor: nuevoValor })
                    .then(function (res) {
                        if (!res.ok) throw new Error(res.error || 'error');
                    })
                    .catch(function () {
                        mostrarToast('No se pudo guardar. Prueba a Actualizar.');
                    });
            }

            /* La nota se guarda sola al salir del cuadro de texto (blur),
               sin botón — como no cambia de tarjeta ni de pestaña, no hace
               falta el aviso de "deshacer" que sí tienen los estados. */
            function guardarNota(fila, valor) {
                var lead = ultimosLeads.filter(function (l) { return l.fila === fila; })[0];
                if (!lead || lead.nota === valor) return;
                lead.nota = valor;

                /* El aviso de "guardada" solo sale si el script confirma que
                   lo ha escrito. Antes salía siempre, aunque hubiera fallado:
                   una nota que se creía guardada y no estaba. */
                pedirAlScript({ accion: 'actualizar', fila: fila, valor: valor, campo: 'nota' })
                    .then(function (res) {
                        if (!res.ok) throw new Error(res.error || 'error');
                        mostrarToast('Nota guardada');
                    })
                    .catch(function () {
                        mostrarToast('No se pudo guardar la nota. Prueba a Actualizar.');
                    });
            }

            /* Archivar es reversible (tocarlo otra vez desarchiva), igual que
               los estados — Cipri pidió poder quitar de en medio lo que ya
               no le importa sin perder el dato por si se equivoca. */
            function archivarLead(fila) {
                var lead = ultimosLeads.filter(function (l) { return l.fila === fila; })[0];
                if (!lead) return;
                lead.archivada = !lead.archivada;
                var nuevoValor = lead.archivada ? 'Sí' : '';

                pintarLeads(ultimosLeads);
                mostrarToast(lead.archivada ? 'Archivada' : 'Desarchivada');

                pedirAlScript({ accion: 'actualizar', fila: fila, valor: nuevoValor, campo: 'archivada' })
                    .then(function (res) {
                        if (!res.ok) throw new Error(res.error || 'error');
                    })
                    .catch(function () {
                        mostrarToast('No se pudo guardar. Prueba a Actualizar.');
                    });
            }

            listaEl.addEventListener('click', function (e) {
                var estadoBtn = e.target.closest('.estado-btn');
                if (estadoBtn) {
                    cambiarEstado(Number(estadoBtn.dataset.fila), estadoBtn.dataset.valor);
                    return;
                }
                var archivarBtn = e.target.closest('.archivar-btn');
                if (archivarBtn) {
                    archivarLead(Number(archivarBtn.dataset.fila));
                    return;
                }
                var cabecera = e.target.closest('.card__cabecera');
                if (cabecera) {
                    var fila = Number(cabecera.dataset.fila);
                    expandidas[fila] = !expandidas[fila];
                    pintarLeads(ultimosLeads);
                }
            });

            filtrosEl.addEventListener('input', function () {
                filtroTexto = buscadorEl.value.trim();
                pintarLeads(ultimosLeads);
            });
            filtrosEl.addEventListener('change', function (e) {
                if (e.target === filtroMesEl) filtroMes = filtroMesEl.value;
                if (e.target === filtroTipoEl) filtroTipo = filtroTipoEl.value;
                pintarLeads(ultimosLeads);
            });

            // 'blur' no burbujea — hace falta capturarlo en la fase de captura.
            listaEl.addEventListener('blur', function (e) {
                var t = e.target;
                if (!t.classList || !t.classList.contains('card__nota')) return;
                guardarNota(Number(t.dataset.fila), t.value);
            }, true);

            pestanasEl.addEventListener('click', function (e) {
                var b = e.target.closest('.pestana');
                if (!b) return;
                pestanaActiva = b.dataset.pestana;
                pintarLeads(ultimosLeads);
            });

            function textoRelativo(fecha) {
                var seg = Math.round((Date.now() - fecha.getTime()) / 1000);
                if (seg < 45) return 'Actualizado hace un momento';
                if (seg < 3600) return 'Actualizado hace ' + Math.floor(seg / 60) + ' min';
                return 'Actualizado hace ' + Math.floor(seg / 3600) + ' h';
            }

            setInterval(function () {
                if (ultimaCarga) ultimaActualizacionEl.textContent = textoRelativo(ultimaCarga);
            }, 30000);

            function actualizarTituloPagina() {
                document.title = (nuevasSinVer > 0 ? '(' + nuevasSinVer + ') ' : '') + TITULO_BASE;
            }

            window.addEventListener('focus', function () {
                nuevasSinVer = 0;
                actualizarTituloPagina();
            });

            function pintarBotonAvisos() {
                if (!('Notification' in window)) {
                    avisosBtn.style.display = 'none';
                    return;
                }
                var activados = Notification.permission === 'granted';
                avisosBtn.classList.toggle('activo', activados);
                document.getElementById('avisosBtnTexto').textContent = activados ? 'Avisos activados' : 'Avisos';
            }

            avisosBtn.addEventListener('click', function () {
                if (!('Notification' in window)) return;
                if (Notification.permission === 'granted') {
                    mostrarToast('Los avisos ya están activados.');
                    return;
                }
                Notification.requestPermission().then(function (permiso) {
                    pintarBotonAvisos();
                    mostrarToast(permiso === 'granted' ? 'Avisos activados' : 'No se han activado los avisos');
                });
            });

            /* Compara la lista recién llegada con la anterior por número de
               fila (no por posición) para ver qué solicitudes son nuevas de
               verdad. La primera carga nunca avisa — solo lo que llega
               DESPUÉS de tener el panel abierto. */
            function avisarNuevos(leads) {
                var idsNuevosSet = leads.map(function (l) { return l.fila; });
                if (idsConocidos === null) {
                    idsConocidos = idsNuevosSet;
                    return;
                }
                var nuevas = leads.filter(function (l) { return idsConocidos.indexOf(l.fila) === -1; });
                idsConocidos = idsNuevosSet;
                if (!nuevas.length) return;

                nuevasSinVer += nuevas.length;
                actualizarTituloPagina();
                mostrarToast(nuevas.length === 1 ? 'Nueva solicitud: ' + (nuevas[0].nombre || 'sin nombre') : nuevas.length + ' solicitudes nuevas');

                if ('Notification' in window && Notification.permission === 'granted') {
                    nuevas.forEach(function (l) {
                        new Notification('Nueva solicitud — Itaca Jiu Jitsu', {
                            body: (l.nombre || 'Sin nombre') + (l.mensaje ? ': ' + l.mensaje : ''),
                            tag: 'lead-' + l.fila
                        });
                    });
                }
            }

            /* Todo lo que el panel le pregunta al script pasa por aquí.
               Va por GET con fetch normal, también para guardar. Google
               responde a las GET del script con "Access-Control-Allow-Origin: *",
               así que el navegador las deja pasar sin más.

               No volver a JSONP (<script src=...>): Google sirve la respuesta
               con "X-Content-Type-Options: nosniff", y en cuanto el tipo de
               contenido no es exactamente JavaScript el navegador se niega a
               ejecutarla y solo se ve "no se ha podido conectar", sin pista de
               por qué. Ese fue el fallo que costó media docena de despliegues. */
            function pedirAlScript(parametros) {
                var clave = localStorage.getItem(CLAVE_GUARDADA) || '';
                var partes = ['clave=' + encodeURIComponent(clave), 't=' + Date.now()];
                Object.keys(parametros).forEach(function (k) {
                    partes.push(encodeURIComponent(k) + '=' + encodeURIComponent(parametros[k]));
                });

                return fetch(URL_SCRIPT + '?' + partes.join('&'), { redirect: 'follow' })
                    .then(function (r) {
                        if (!r.ok) throw new Error('el script respondió ' + r.status);
                        return r.text();
                    })
                    .then(function (texto) {
                        var limpio = texto.trim();
                        /* Versiones viejas del script envolvían la respuesta
                           para JSONP: nombreDeFuncion({...}). Se le quita. */
                        var envuelto = limpio.match(/^[\w$.]+\s*\(([\s\S]*)\)\s*;?$/);
                        if (envuelto) limpio = envuelto[1].trim();
                        if (limpio.charAt(0) === '<') {
                            throw new Error('el script devolvió una página de error de Google. Vuelve a publicar una versión nueva desde Apps Script.');
                        }
                        try {
                            return JSON.parse(limpio);
                        } catch (err) {
                            throw new Error('el script respondió algo que no se entiende. Comprueba que pegaste la última versión del código y publicaste versión nueva.');
                        }
                    });
            }

            function cargar() {
                var hayDatosPrevios = ultimosLeads.length > 0;
                if (hayDatosPrevios) {
                    // No borramos lo que ya se ve — solo lo atenuamos mientras
                    // llega lo nuevo, para no dar el "parpadeo" de pantalla en
                    // blanco cada vez que se actualiza.
                    listaEl.style.opacity = '.5';
                    estadisticasEl.style.opacity = '.5';
                } else {
                    estadoEl.textContent = 'Cargando...';
                    estadoEl.style.display = 'block';
                }
                vacioEl.style.display = 'none';

                pedirAlScript({}).then(function (res) {
                    if (!res.ok) {
                        if (res.error === 'clave incorrecta') {
                            localStorage.removeItem(CLAVE_GUARDADA);
                            mostrarPuerta(true);
                            return;
                        }
                        throw new Error(res.error || 'error desconocido');
                    }
                    estadoEl.style.display = 'none';
                    pintarLeads(res.leads || []);
                    avisarNuevos(res.leads || []);
                    ultimaCarga = new Date();
                    ultimaActualizacionEl.textContent = textoRelativo(ultimaCarga);
                }).catch(function (err) {
                    if (hayDatosPrevios) {
                        mostrarToast('No se pudo actualizar. Sigues viendo los datos de antes.');
                    } else {
                        /* El motivo real, no un "no se ha podido conectar"
                           genérico: es la diferencia entre saber qué arreglar
                           y volver a probar a ciegas. */
                        estadoEl.textContent = 'No se ha podido cargar: ' + err.message;
                        estadoEl.style.display = 'block';
                    }
                }).then(function () {
                    listaEl.style.opacity = '';
                    estadisticasEl.style.opacity = '';
                });
            }

            actualizarBtn.addEventListener('click', cargar);

            function mostrarPuerta(conError) {
                puerta.style.display = 'block';
                panel.style.display = 'none';
                puertaError.style.display = conError ? 'block' : 'none';
                claveInput.value = '';
                claveInput.focus();
            }

            var sondeoIniciado = false;

            function mostrarPanel() {
                puerta.style.display = 'none';
                panel.style.display = 'block';
                cargar();
                // Mientras el panel siga abierto (aunque esté en segundo
                // plano), vuelve a pedir la lista cada minuto para detectar
                // solicitudes nuevas sin que Cipri tenga que tocar nada.
                if (!sondeoIniciado) {
                    sondeoIniciado = true;
                    setInterval(cargar, 60000);
                }
            }

            entrarBtn.addEventListener('click', function () {
                var clave = claveInput.value.trim();
                if (!clave) return;
                localStorage.setItem(CLAVE_GUARDADA, clave);
                mostrarPanel();
            });
            claveInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') entrarBtn.click();
            });

            pintarBotonAvisos();

            if (localStorage.getItem(CLAVE_GUARDADA)) {
                mostrarPanel();
            } else {
                mostrarPuerta(false);
            }
        })();
    </script>
</body>

</html>
