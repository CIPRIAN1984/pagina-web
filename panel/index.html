<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Panel — Itaca Jiu Jitsu</title>
    <!-- Panel privado de uso interno, para ver de un vistazo quién ha escrito
         por la web y marcar qué toca hacer, sin abrir la hoja de cálculo.
         No sale enlazado desde ningún sitio de la web pública ni en
         buscadores (robots noindex + robots.txt). Los datos los sirve el
         mismo script de Google Apps Script que guarda los leads, protegido
         por una clave que solo conoce Cipri — ver docs/hoja-de-calculo.md.

         Pestañas por ESTADO, no por fecha (18 de agosto de 2026, tras
         probarlo Cipri: las pestañas de fecha lo dejaban en "Antiguas" sin
         entender por qué, y marcar una acción no se podía deshacer). Ahora
         el eje principal es qué falta por hacer: Pendientes / Gestionadas /
         Estadísticas / Todas. Cualquier botón de acción se puede volver a
         tocar para deshacerlo (vuelve a "sin gestionar"). La fecha llega
         como "dd/MM HH:mm" (sin año) y solo se usa para "nuevas hoy" y para
         los números de Estadísticas (este mes / este año / desde siempre). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0b0b0d;
            --bg-elev: #16161a;
            --bg-elev-2: #1e1e23;
            --border: #2a2a30;
            --text: #f2f2f3;
            --text-dim: #98989f;
            --accent: #34d399;
            --accent-soft: rgba(52, 211, 153, .14);
            --amber: #f0a83e;
            --amber-soft: rgba(240, 168, 62, .14);
            --red: #f16565;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Archivo', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
        }

        button,
        input {
            font: inherit;
        }

        /* ── Puerta de acceso ─────────────────────────────────────── */
        #puerta {
            max-width: 22rem;
            margin: 4rem auto;
            padding: 2rem;
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        #puerta h1 {
            font-size: 1.3rem;
            margin-bottom: .5rem;
        }

        #puerta p {
            color: var(--text-dim);
            font-size: .9rem;
            margin-bottom: 1.25rem;
        }

        #puerta input {
            width: 100%;
            padding: .75rem;
            background: var(--bg-elev-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            margin-bottom: .75rem;
        }

        #puerta button {
            width: 100%;
            padding: .75rem;
            background: var(--accent);
            color: #06241a;
            border: 0;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        #puertaError {
            color: var(--red);
            font-size: .85rem;
            margin-top: .6rem;
            display: none;
        }

        /* ── Panel ────────────────────────────────────────────────── */
        #panel {
            display: none;
            max-width: 720px;
            margin: 0 auto;
            padding: 1.5rem 1rem 4rem;
        }

        header.top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            gap: .75rem;
            flex-wrap: wrap;
        }

        header.top h1 {
            font-size: 1.25rem;
            letter-spacing: -.01em;
        }

        .top-acciones {
            display: flex;
            gap: .5rem;
        }

        .btn-mini {
            border: 1px solid var(--border);
            background: var(--bg-elev);
            color: var(--text-dim);
            border-radius: 999px;
            padding: .4rem .8rem;
            font-size: .78rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* ── Resumen (fila de números) ───────────────────────────── */
        .resumen {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: .6rem;
            margin-bottom: 1.1rem;
        }

        .resumen__item {
            min-width: 0;
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: .7rem .8rem;
        }

        .resumen__num {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .resumen__label {
            font-size: .7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: .03em;
            margin-top: .1rem;
            overflow-wrap: break-word;
        }

        /* ── Pestañas principales ─────────────────────────────────── */
        .pestanas {
            display: flex;
            gap: .4rem;
            overflow-x: auto;
            padding-bottom: .3rem;
            margin-bottom: 1rem;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .pestanas::-webkit-scrollbar {
            display: none;
        }

        .pestana {
            flex: 0 0 auto;
            border: 1px solid var(--border);
            background: var(--bg-elev);
            color: var(--text-dim);
            border-radius: 999px;
            padding: .5rem 1rem;
            font-size: .82rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .pestana .cuenta {
            color: inherit;
            opacity: .65;
            margin-left: .3rem;
        }

        .pestana.activa {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
        }

        #estado {
            text-align: center;
            color: var(--text-dim);
            padding: 3rem 1rem;
            font-size: .9rem;
        }

        .card {
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.1rem;
            margin-bottom: .7rem;
            transition: opacity .2s;
        }

        .card.resuelto {
            opacity: .7;
        }

        .card__fila1 {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: .5rem;
            margin-bottom: .3rem;
        }

        .card__nombre {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .card__fecha {
            font-size: .75rem;
            color: var(--text-dim);
            white-space: nowrap;
        }

        .card__meta {
            display: flex;
            flex-wrap: wrap;
            gap: .4rem;
            margin-bottom: .5rem;
        }

        .etiqueta {
            display: inline-block;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .03em;
            text-transform: uppercase;
            padding: .15rem .5rem;
            border-radius: 999px;
            background: var(--bg-elev-2);
            color: var(--text-dim);
        }

        .etiqueta.tipo-prueba {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .etiqueta.ofertas {
            background: var(--amber-soft);
            color: var(--amber);
        }

        .etiqueta.estado-hecho {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .card__mensaje {
            font-size: .92rem;
            color: var(--text);
            opacity: .85;
            margin-bottom: .7rem;
            white-space: pre-wrap;
        }

        .card__acciones {
            display: flex;
            flex-wrap: wrap;
            gap: .45rem;
        }

        .btn {
            border: 1px solid var(--border);
            background: var(--bg-elev-2);
            border-radius: 999px;
            padding: .5rem .85rem;
            font-size: .82rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text);
        }

        .btn.whatsapp {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn.estado-btn.elegido {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        #vacio {
            text-align: center;
            color: var(--text-dim);
            padding: 3rem 1rem;
            font-size: .92rem;
        }

        /* ── Estadísticas ─────────────────────────────────────────── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: .6rem;
            margin-bottom: 1.4rem;
        }

        .stats-seccion {
            margin-bottom: 1.5rem;
        }

        .stats-seccion h2 {
            font-size: .78rem;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--text-dim);
            font-weight: 700;
            margin-bottom: .8rem;
        }

        .stats-fila {
            margin-bottom: .7rem;
        }

        .stats-fila__linea {
            display: flex;
            justify-content: space-between;
            gap: .5rem;
            font-size: .88rem;
            margin-bottom: .3rem;
        }

        .stats-fila__num {
            color: var(--text-dim);
            font-weight: 600;
            white-space: nowrap;
        }

        .stats-barra {
            height: 6px;
            background: var(--bg-elev-2);
            border-radius: 999px;
            overflow: hidden;
        }

        .stats-barra__relleno {
            height: 100%;
            background: var(--accent);
            border-radius: 999px;
        }

        /* ── Aviso flotante (toast) ───────────────────────────────── */
        #toast {
            position: fixed;
            left: 50%;
            bottom: 1.5rem;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-elev-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: .65rem 1.1rem;
            border-radius: 999px;
            font-size: .85rem;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s, transform .25s;
            z-index: 50;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .4);
            max-width: 90vw;
            text-align: center;
        }

        #toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>

    <div id="puerta">
        <h1>Panel de solicitudes</h1>
        <p>Introduce la clave del panel (la que pusiste en el script).</p>
        <input type="password" id="claveInput" placeholder="Clave" autocomplete="off">
        <button id="entrarBtn">Entrar</button>
        <p id="puertaError">Clave incorrecta. Inténtalo de nuevo.</p>
    </div>

    <div id="panel">
        <header class="top">
            <h1>Solicitudes</h1>
            <div class="top-acciones">
                <button class="btn-mini" id="actualizarBtn">↻ Actualizar</button>
            </div>
        </header>

        <div class="resumen" id="resumen">
            <div class="resumen__item">
                <div class="resumen__num" id="numTotal">–</div>
                <div class="resumen__label">Total</div>
            </div>
            <div class="resumen__item">
                <div class="resumen__num" id="numPendientes">–</div>
                <div class="resumen__label">Pendientes</div>
            </div>
            <div class="resumen__item">
                <div class="resumen__num" id="numGestionadas">–</div>
                <div class="resumen__label">Gestionadas</div>
            </div>
            <div class="resumen__item">
                <div class="resumen__num" id="numHoy">–</div>
                <div class="resumen__label">Nuevas hoy</div>
            </div>
        </div>

        <div class="pestanas" id="pestanas"></div>

        <div id="estado"></div>
        <div id="lista"></div>
        <div id="estadisticas" style="display:none"></div>
        <div id="vacio" style="display:none">No hay nada en esta pestaña. Al día 🎉</div>
    </div>

    <div id="toast"></div>

    <script>
        (function () {
            'use strict';

            // Mismo script de Apps Script que guarda los formularios de la web.
            var URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbwi1x9HqLkd-uJt-bsHwqeZnEHqL8rG9be80jAbDK-X5cNvM4VUPEfC6wQsC9ZtNmOA/exec';
            var CLAVE_GUARDADA = 'itaca_panel_clave';

            var PESTANAS = [
                { id: 'pendientes', etiqueta: 'Pendientes' },
                { id: 'gestionadas', etiqueta: 'Gestionadas' },
                { id: 'estadisticas', etiqueta: 'Estadísticas' },
                { id: 'todas', etiqueta: 'Todas' }
            ];

            var OPCIONES_ESTADO = ['Mandar info', 'Apuntar a la prueba', 'Otro'];

            var puerta = document.getElementById('puerta');
            var panel = document.getElementById('panel');
            var claveInput = document.getElementById('claveInput');
            var entrarBtn = document.getElementById('entrarBtn');
            var puertaError = document.getElementById('puertaError');
            var estadoEl = document.getElementById('estado');
            var listaEl = document.getElementById('lista');
            var estadisticasEl = document.getElementById('estadisticas');
            var vacioEl = document.getElementById('vacio');
            var actualizarBtn = document.getElementById('actualizarBtn');
            var pestanasEl = document.getElementById('pestanas');
            var toastEl = document.getElementById('toast');

            var pestanaActiva = 'pendientes';
            var ultimosLeads = [];
            var toastTimer = null;

            /* La fecha llega como "dd/MM HH:mm" (sin año). Se asume el año
               actual; si el resultado queda en el futuro, es que la
               solicitud es del año anterior. */
            function parsearFecha(fechaStr) {
                var m = /^(\d{2})\/(\d{2}) (\d{2}):(\d{2})$/.exec(fechaStr || '');
                if (!m) return null;
                var ahora = new Date();
                var d = new Date(ahora.getFullYear(), Number(m[2]) - 1, Number(m[1]), Number(m[3]), Number(m[4]));
                if (d.getTime() > ahora.getTime() + 24 * 60 * 60 * 1000) {
                    d.setFullYear(d.getFullYear() - 1);
                }
                return d;
            }

            function esDeHoy(lead) {
                var d = parsearFecha(lead.fecha);
                if (!d) return false;
                var hoy = new Date();
                return d.getFullYear() === hoy.getFullYear() && d.getMonth() === hoy.getMonth() && d.getDate() === hoy.getDate();
            }

            function esDeEsteMes(lead) {
                var d = parsearFecha(lead.fecha);
                if (!d) return false;
                var hoy = new Date();
                return d.getFullYear() === hoy.getFullYear() && d.getMonth() === hoy.getMonth();
            }

            function esDeEsteAnio(lead) {
                var d = parsearFecha(lead.fecha);
                if (!d) return false;
                var hoy = new Date();
                return d.getFullYear() === hoy.getFullYear();
            }

            function enlaceWhatsApp(telefono, nombre) {
                /* La hoja de Google puede guardar el teléfono como número, no
                   como texto, según cómo lo haya escrito quien rellenó el
                   formulario — por eso se fuerza a texto antes de nada. */
                var num = String(telefono || '').replace(/[^\d]/g, '');
                if (!num) return null;
                if (num.length === 9) num = '34' + num;
                else if (num.indexOf('0034') === 0) num = num.slice(2);
                if (num.length < 11) return null;
                var primerNombre = String(nombre || '').split(' ')[0];
                var texto = 'Hola' + (primerNombre ? ' ' + primerNombre : '') +
                    ', soy de Itaca Jiu Jitsu. Te escribo por tu solicitud desde la web.';
                return 'https://wa.me/' + num + '?text=' + encodeURIComponent(texto);
            }

            function escapar(s) {
                var div = document.createElement('div');
                div.textContent = s || '';
                return div.innerHTML;
            }

            function mostrarToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('visible');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(function () {
                    toastEl.classList.remove('visible');
                }, 2200);
            }

            function pintarResumen(leads) {
                document.getElementById('numTotal').textContent = leads.length;
                document.getElementById('numPendientes').textContent = leads.filter(function (l) { return !l.accion; }).length;
                document.getElementById('numGestionadas').textContent = leads.filter(function (l) { return l.accion; }).length;
                document.getElementById('numHoy').textContent = leads.filter(esDeHoy).length;
            }

            function pintarPestanas(leads) {
                pestanasEl.innerHTML = '';
                var cuentas = {
                    pendientes: leads.filter(function (l) { return !l.accion; }).length,
                    gestionadas: leads.filter(function (l) { return l.accion; }).length,
                    todas: leads.length
                };
                PESTANAS.forEach(function (p) {
                    var btn = document.createElement('button');
                    btn.className = 'pestana' + (p.id === pestanaActiva ? ' activa' : '');
                    btn.dataset.pestana = p.id;
                    var cuentaHtml = p.id in cuentas ? '<span class="cuenta">' + cuentas[p.id] + '</span>' : '';
                    btn.innerHTML = escapar(p.etiqueta) + cuentaHtml;
                    pestanasEl.appendChild(btn);
                });
            }

            function statCard(num, label) {
                return '<div class="resumen__item"><div class="resumen__num">' + num +
                    '</div><div class="resumen__label">' + escapar(label) + '</div></div>';
            }

            function statFila(label, num, total) {
                var pct = total ? Math.round((num / total) * 100) : 0;
                return '<div class="stats-fila">' +
                    '<div class="stats-fila__linea"><span>' + escapar(label) + '</span>' +
                    '<span class="stats-fila__num">' + num + ' · ' + pct + '%</span></div>' +
                    '<div class="stats-barra"><div class="stats-barra__relleno" style="width:' + pct + '%"></div></div>' +
                    '</div>';
            }

            function pintarEstadisticas(leads) {
                var total = leads.length;
                var esteMes = leads.filter(esDeEsteMes).length;
                var esteAnio = leads.filter(esDeEsteAnio).length;

                var pruebas = leads.filter(function (l) { return String(l.tipo || '').indexOf('prueba') !== -1; }).length;
                var contactos = total - pruebas;

                var sinGestionar = leads.filter(function (l) { return !l.accion; }).length;

                var ofertas = leads.filter(function (l) { return l.aceptaOfertas === 'Sí'; }).length;

                var html = '<div class="stats-grid">' +
                    statCard(esteMes, 'Este mes') +
                    statCard(esteAnio, 'Este año') +
                    statCard(total, 'Desde siempre') +
                    '</div>';

                html += '<div class="stats-seccion"><h2>Por tipo de solicitud</h2>' +
                    statFila('Contacto', contactos, total) +
                    statFila('Clase de prueba', pruebas, total) +
                    '</div>';

                html += '<div class="stats-seccion"><h2>Por acción</h2>' +
                    statFila('Sin gestionar', sinGestionar, total) +
                    OPCIONES_ESTADO.map(function (op) {
                        return statFila(op, leads.filter(function (l) { return l.accion === op; }).length, total);
                    }).join('') +
                    '</div>';

                html += '<div class="stats-seccion"><h2>Marketing</h2>' +
                    statFila('Quieren recibir ofertas', ofertas, total) +
                    '</div>';

                estadisticasEl.innerHTML = total ? html : '';
            }

            function pintarLeads(leads) {
                ultimosLeads = leads;
                pintarResumen(leads);
                pintarPestanas(leads);

                if (pestanaActiva === 'estadisticas') {
                    listaEl.style.display = 'none';
                    vacioEl.style.display = 'none';
                    estadisticasEl.style.display = 'block';
                    pintarEstadisticas(leads);
                    return;
                }
                estadisticasEl.style.display = 'none';
                listaEl.style.display = 'block';

                listaEl.innerHTML = '';
                var visibles = leads.filter(function (l) {
                    if (pestanaActiva === 'pendientes') return !l.accion;
                    if (pestanaActiva === 'gestionadas') return !!l.accion;
                    return true; // 'todas'
                });

                if (!visibles.length) {
                    vacioEl.style.display = 'block';
                    return;
                }
                vacioEl.style.display = 'none';

                visibles.forEach(function (lead) {
                  try {
                    var card = document.createElement('div');
                    card.className = 'card' + (lead.accion ? ' resuelto' : '');

                    var tipoTexto = String(lead.tipo || '');
                    var etiquetas = '';
                    if (tipoTexto.indexOf('prueba') !== -1) {
                        etiquetas += '<span class="etiqueta tipo-prueba">Clase de prueba</span>';
                    } else {
                        etiquetas += '<span class="etiqueta">Contacto</span>';
                    }
                    if (lead.categoria) etiquetas += '<span class="etiqueta">' + escapar(lead.categoria) + '</span>';
                    if (lead.dia) etiquetas += '<span class="etiqueta">' + escapar(lead.dia) + '</span>';
                    if (lead.aceptaOfertas === 'Sí') etiquetas += '<span class="etiqueta ofertas">Quiere ofertas</span>';
                    etiquetas += '<span class="etiqueta' + (lead.accion ? ' estado-hecho' : '') + '">' +
                        (lead.accion ? escapar(lead.accion) : 'Sin gestionar') + '</span>';

                    var wa = enlaceWhatsApp(lead.telefono, lead.nombre);

                    var botonesEstado = OPCIONES_ESTADO.map(function (op) {
                        var elegido = lead.accion === op ? ' elegido' : '';
                        return '<button class="btn estado-btn' + elegido + '" data-fila="' + lead.fila +
                            '" data-valor="' + escapar(op) + '">' + op + '</button>';
                    }).join('');

                    card.innerHTML =
                        '<div class="card__fila1">' +
                        '<span class="card__nombre">' + (escapar(lead.nombre) || '(sin nombre)') + '</span>' +
                        '<span class="card__fecha">' + escapar(lead.fecha) + '</span>' +
                        '</div>' +
                        '<div class="card__meta">' + etiquetas + '</div>' +
                        '<div class="card__mensaje">' + (escapar(lead.mensaje) || '<em>Sin mensaje</em>') + '</div>' +
                        '<div class="card__acciones">' +
                        (wa ? '<a class="btn whatsapp" href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
                        botonesEstado +
                        '</div>';

                    listaEl.appendChild(card);
                  } catch (err) {
                    /* Una fila con datos inesperados no debe tirar abajo el
                       resto del panel — se salta esa tarjeta y sigue con las
                       demás, en vez de dejar la pantalla en blanco sin aviso. */
                    console.error('No se pudo pintar un lead:', lead, err);
                  }
                });
            }

            /* Tocar la misma opción que ya está marcada la deshace (vuelve a
               "sin gestionar") — antes era un camino de un solo sentido y
               Cipri se quedaba sin saber cómo volver atrás. */
            function cambiarEstado(fila, valorTocado) {
                var lead = ultimosLeads.filter(function (l) { return l.fila === fila; })[0];
                if (!lead) return;
                var nuevoValor = lead.accion === valorTocado ? '' : valorTocado;
                lead.accion = nuevoValor;

                pintarLeads(ultimosLeads);
                mostrarToast(nuevoValor ? ('Marcado: ' + nuevoValor) : 'Vuelto a pendiente');

                var clave = localStorage.getItem(CLAVE_GUARDADA);
                fetch(URL_SCRIPT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ accion: 'actualizar', clave: clave, fila: fila, valor: nuevoValor })
                }).catch(function () {
                    mostrarToast('No se pudo guardar. Prueba a Actualizar.');
                });
            }

            listaEl.addEventListener('click', function (e) {
                var b = e.target.closest('.estado-btn');
                if (!b) return;
                cambiarEstado(Number(b.dataset.fila), b.dataset.valor);
            });

            pestanasEl.addEventListener('click', function (e) {
                var b = e.target.closest('.pestana');
                if (!b) return;
                pestanaActiva = b.dataset.pestana;
                pintarLeads(ultimosLeads);
            });

            function cargar() {
                estadoEl.textContent = 'Cargando...';
                estadoEl.style.display = 'block';
                listaEl.innerHTML = '';
                estadisticasEl.innerHTML = '';
                vacioEl.style.display = 'none';

                var clave = localStorage.getItem(CLAVE_GUARDADA);
                fetch(URL_SCRIPT + '?clave=' + encodeURIComponent(clave))
                    .then(function (r) { return r.json(); })
                    .then(function (res) {
                        if (!res.ok) {
                            if (res.error === 'clave incorrecta') {
                                localStorage.removeItem(CLAVE_GUARDADA);
                                mostrarPuerta(true);
                                return;
                            }
                            estadoEl.textContent = 'No se ha podido cargar: ' + (res.error || 'error desconocido');
                            return;
                        }
                        estadoEl.style.display = 'none';
                        pintarLeads(res.leads || []);
                    })
                    .catch(function () {
                        estadoEl.textContent = 'No se ha podido conectar. Comprueba tu conexión y pulsa Actualizar.';
                    });
            }

            actualizarBtn.addEventListener('click', cargar);

            function mostrarPuerta(conError) {
                puerta.style.display = 'block';
                panel.style.display = 'none';
                puertaError.style.display = conError ? 'block' : 'none';
                claveInput.value = '';
                claveInput.focus();
            }

            function mostrarPanel() {
                puerta.style.display = 'none';
                panel.style.display = 'block';
                cargar();
            }

            entrarBtn.addEventListener('click', function () {
                var clave = claveInput.value.trim();
                if (!clave) return;
                localStorage.setItem(CLAVE_GUARDADA, clave);
                mostrarPanel();
            });
            claveInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') entrarBtn.click();
            });

            if (localStorage.getItem(CLAVE_GUARDADA)) {
                mostrarPanel();
            } else {
                mostrarPuerta(false);
            }
        })();
    </script>
</body>

</html>
